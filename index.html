      }

        display: flex;
        width: 80%;
        max-width: 1200px;
        gap: 20px;
      }
      .left,
      .right {
        flex: 1;
      }
      .left label {
        display: block;
        margin-bottom: 5px;
      }
      .left input,

        display: block;
        margin-bottom: 10px;
        width: 100%;

        height: 30px;
        border: 1px solid #000;
        margin-left: 10px;
      }
      .right button {

        margin-bottom: 10px;

      .preview img {

        <input

          id="colorInput"

          value="#FF0000"

          id="borderWidthInput"

      <div class="right">
